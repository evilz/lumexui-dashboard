<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Culturae</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.build.css" />
    <link rel="stylesheet" href="Culturae.Client.styles.css" />
    <link rel="stylesheet" href="_content/Blazor.Sonner/styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
        (function() {
            const savedTheme = localStorage.getItem('themeMode');
            let theme = savedTheme;
            if (!theme || theme === 'system') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(theme);
        })();
    </script>
</head>

<body class="min-h-screen bg-background">
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:transparent;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--lumex-default-500, #888);animation:spin 1s linear infinite;">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
        </div>
        <style>
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </div>


    <script src="_content/LumexUI/js/LumexUI.js" type="module"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
